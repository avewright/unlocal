name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # The commands in the README have to work on a clean checkout, not just in tests.
      - name: Plan and deploy the example
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cp -R examples/fullstack/. "$work"
          pnpm --silent unlocal --dir "$work" plan --json > /dev/null
          pnpm --silent unlocal --dir "$work" up --sim --json > /dev/null
      # What `npx unlocal` runs: the compiled package, installed outside the repo.
      - name: Build and try the npm package
        run: |
          set -euo pipefail
          node scripts/pack.ts
          dest="$(mktemp -d)"
          (cd build/npm && npm pack --pack-destination "$dest" --silent)
          cd "$dest" && npm init -y > /dev/null && npm install --silent --no-audit --no-fund ./unlocal-*.tgz
          mkdir site && echo '<h1>hi</h1>' > site/index.html
          UNLOCAL_HOME="$dest/home" npx unlocal --dir site up --sim --json > /dev/null
